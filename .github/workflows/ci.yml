name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @engine/crawler exec playwright install --with-deps chromium

      - run: pnpm turbo run typecheck

      - run: pnpm turbo run build

      - run: pnpm turbo run test

  # ── Apply pending migrations ───────────────────────────────────────────────
  # The API is deployed from code that assumes the schema in
  # infra/migrations/postgres. Until this job existed nothing applied those
  # files: migrations 0017 and 0018 were merged, the Worker that reads the
  # columns they add was deployed, and every integration route answered 500
  # until someone ran `pnpm db:migrate` by hand. This job runs before
  # deploy-api so the schema always lands first.
  #
  # DATABASE_URL is the one secret this workflow does hold. The runner uses it
  # for a single transaction and never prints it (the CLI logs host and
  # database only). Applying migrations is idempotent: an up-to-date database
  # logs "Already up to date." and the job passes.
  #
  # cancel-in-progress is off on purpose. A migration is one transaction, so a
  # cancelled run cannot leave a half-applied schema, but a second run queued
  # behind it is cheaper than reasoning about a cancelled one.
  migrate:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: db-migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fail loudly rather than let the CLI fall back to apps/api/.dev.vars,
      # which does not exist on the runner and would produce a less specific
      # error.
      - name: Require DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL repository secret is not set. Add the Neon pooled" \
                 "connection string under Settings → Secrets and variables → Actions →" \
                 "Secrets. Without it migrations cannot run and deploy-api is skipped," \
                 "because deploying code against a schema it does not match breaks" \
                 "every route that reads the new columns."
            exit 1
          fi

      - name: Show applied and pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:status

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

  # ── Publish the API Worker ─────────────────────────────────────────────────
  # The dashboard is useless without this: sign-in goes through the API, so a
  # published page pointing at a Worker that does not exist is a login screen
  # that can only fail. Deploying both from the same green commit keeps them
  # from drifting apart.
  #
  # This deploys CODE ONLY. The Worker's secrets (DATABASE_URL,
  # LOCAL_AUTH_SECRET, LOCAL_AUTH_USERS, and the optional vendor keys listed in
  # apps/api/wrangler.toml) are set once against the Worker itself, with
  # `wrangler secret put` or the Cloudflare dashboard, and survive every later
  # deploy. They are deliberately NOT passed through CI: that would put the
  # database URL and three people's passwords in a second system to leak from.
  # Until they exist, POST /auth/login answers "Credential sign-in is not
  # configured on this deployment" — a clear message, not a crash.
  deploy-api:
    # Waits on migrate as well as build: the Worker must never go live ahead of
    # the schema it reads.
    needs: [build, migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: api-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # wrangler bundles from src/index.ts directly, but that file's @engine/*
      # imports resolve to those packages' dist/, so the workspace has to be
      # built first or the bundle fails on unresolved modules.
      - name: Build the packages the Worker imports
        run: pnpm turbo run build --filter=@engine/api

      # The API token needs "Workers Scripts: Edit" on top of the
      # "Cloudflare Pages: Edit" the other deploy job uses.
      - name: Publish to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.17'
          workingDirectory: apps/api
          command: deploy

  # ── Publish to Cloudflare Pages ────────────────────────────────────────────
  # Merging used to deploy nothing: this file ran typecheck/build/test and
  # stopped, so the live site served whatever build was last uploaded by hand
  # (for a stretch, one from July, which is why a merged login fix appeared not
  # to work). This job closes that gap.
  #
  # `needs: build` means a red build is never published, and the push/ref guard
  # means a pull request never is either — a PR must be able to run CI without
  # touching production.
  deploy:
    # Also waits on deploy-api, so the API is live before the page that points
    # at it is. Publishing a dashboard whose backend failed to deploy is the
    # exact failure this whole workflow exists to stop.
    needs: [build, deploy-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time, newest wins: two quick merges must not race to
    # decide which build ends up live.
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ENGINE_API_BASE is a repository *variable*, not a secret. It is written
      # into a public page, so it is not confidential — and a secret would be
      # masked in the log, hiding the one place this value can be checked.
      #
      # Unset is a hard failure here, unlike in assembleSite.mjs, which only
      # warns. That asymmetry is deliberate: a local build without it is
      # correct (the app falls back to http://localhost:8787), a deployed one
      # is a site nobody can sign in to, because sign-in goes through the API.
      - name: Require ENGINE_API_BASE
        env:
          ENGINE_API_BASE: ${{ vars.ENGINE_API_BASE }}
        run: |
          if [ -z "$ENGINE_API_BASE" ]; then
            echo "::error::ENGINE_API_BASE repository variable is not set. Set it under" \
                 "Settings → Secrets and variables → Actions → Variables to the deployed" \
                 "API origin (e.g. https://engine-api.<subdomain>.workers.dev). Without it" \
                 "the published site cannot reach the API and nobody can sign in."
            exit 1
          fi

      - name: Build the site
        env:
          ENGINE_API_BASE: ${{ vars.ENGINE_API_BASE }}
        run: pnpm turbo run build --filter=@engine/dashboard

      # Assert the artifact, not the intent. The failure this guards against is
      # silent: turbo runs tasks in strict env mode, so an ENGINE_API_BASE that
      # is not declared in turbo.json's `env` is stripped before assembleSite
      # ever sees it, and the build still succeeds — with no API origin baked
      # in. Checking the file is the only check that cannot be fooled by that.
      - name: Verify the API origin was baked in
        env:
          ENGINE_API_BASE: ${{ vars.ENGINE_API_BASE }}
        run: |
          expected="${ENGINE_API_BASE%/}"
          if ! grep -qF "window.ENGINE_API_BASE=\"$expected\"" apps/dashboard/site/app/index.html; then
            echo "::error::apps/dashboard/site/app/index.html does not carry" \
                 "window.ENGINE_API_BASE=\"$expected\". Refusing to publish a site that" \
                 "cannot reach the API. Check turbo.json's build.env and assembleSite.mjs."
            exit 1
          fi
          echo "Baked API origin: $expected"

      # Uploads to the `engineai` Pages project. --branch=main makes this a
      # production deployment rather than a preview.
      #
      # That project is ALSO connected to this repo through Cloudflare's own
      # git integration — it has been posting a "Cloudflare Pages" check on
      # every PR since at least #59, which is why "merging deploys nothing" was
      # only half true. Both paths can publish to the same project, so
      # automatic deployments must stay disabled on it (Pages project →
      # Settings → Builds → branch control) or the two race and the winner
      # decides whether the deployed page has an API origin baked in. This one
      # is the path that checks.
      # workingDirectory matters here, and not for tidiness: wrangler-action
      # probes for wrangler with `pnpm exec` and installs it when absent. At
      # the repo root that install is `pnpm add wrangler`, which pnpm refuses
      # in a workspace root without -w (ERR_PNPM_ADDING_TO_ROOT) — the first
      # real run failed exactly there. Running from apps/dashboard, where
      # wrangler is now a devDependency, means the probe succeeds and nothing
      # is installed. apps/dashboard has no wrangler config file, so there is
      # no Workers config for `pages deploy` to trip over either.
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.17'
          workingDirectory: apps/dashboard
          command: pages deploy site --project-name=engineai --branch=main
