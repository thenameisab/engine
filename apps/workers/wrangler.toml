name = "engine-edge"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# One deployed worker per customer site (the 'edge-worker' DeployTarget —
# see @engine/core's DeployTarget.workerName). ORIGIN and PROJECT_ID are set
# per environment below; DATABASE_URL is bound as a secret
# (`wrangler secret put DATABASE_URL --env <site>`), never committed here.

[env.example]
name = "engine-edge-example"
vars = { ORIGIN = "https://example-customer-origin.com", PROJECT_ID = "00000000-0000-0000-0000-000000000000" }
