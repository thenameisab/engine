name = "engine-edge"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# One deployed worker per customer site (the 'edge-worker' DeployTarget —
# see @engine/core's DeployTarget.workerName). ORIGIN and PROJECT_ID are set
# per environment below; DATABASE_URL is bound as a secret
# (`wrangler secret put DATABASE_URL --env <site>`), never committed here.
#
# INTERNAL_API_TOKEN is also a secret, and must match the value bound on
# apps/api: this worker has no user session, so it authenticates its C1.7
# auto-rollback call to the API with it. Without it the API returns 401 and
# a failing fix will not roll itself back (the worker logs the failure).

[env.example]
name = "engine-edge-example"
vars = { ORIGIN = "https://example-customer-origin.com", PROJECT_ID = "00000000-0000-0000-0000-000000000000", API_BASE_URL = "https://api.engine.example" }
