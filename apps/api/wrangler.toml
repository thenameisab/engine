name = "engine-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# Required by the `postgres` driver (node built-ins) on the Workers runtime.
compatibility_flags = ["nodejs_compat"]

# ── Auth ───────────────────────────────────────────────────────────────────
# Every /projects/* and /accounts/* route, plus /health/integrations, requires
# a Neon Auth (Better Auth) JWT — verified against this JWKS. The URL is public
# (it publishes verification keys, not signing keys), so it ships as a default
# var: a freshly deployed Worker is gated, not open. The gate fails closed —
# unset AUTH_JWKS_URL means 503, never "allow".
[vars]
AUTH_JWKS_URL = "https://ep-wild-wildflower-aomyso5f.neonauth.c-2.ap-southeast-1.aws.neon.tech/neondb/auth/.well-known/jwks.json"

# ── Scheduled work ─────────────────────────────────────────────────────────
# Nightly Google sync (GSC + GA4 + GBP). 03:15 UTC — after Google's own daily
# processing settles, and off the hour so it does not pile onto the platform's
# busiest cron minute. GSC data still lags ~2 days and is revised for several
# more, so each run re-fetches a 28-day window and upserts; that is how a
# revision lands rather than being missed.
[triggers]
crons = ["15 3 * * *"]

# ── External integrations ──────────────────────────────────────────────────
# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   DATABASE_URL          Neon Postgres connection string
#   INTERNAL_API_TOKEN    Shared service token for the edge worker's C1.7
#                         auto-rollback call (no user session behind it).
#                         Bind the same value on apps/workers.
#   GOOGLE_CLIENT_SECRET  Google OAuth client secret (customer GSC/GA4/GBP connect)
#   ENCRYPTION_KEY        base64 of 32 random bytes (`openssl rand -base64 32`).
#                         Seals customer refresh tokens at rest. Rotating it
#                         invalidates every stored connection — every customer
#                         must reconnect.
#   OAUTH_STATE_SECRET    Signs the OAuth `state` parameter, so a callback
#                         cannot be redirected at another account.
#   GITHUB_DISPATCH_TOKEN Fine-grained GitHub token with `actions: write` on
#                         this repository. Lets "Run audit" start the crawl
#                         workflow at once instead of at its 15-minute
#                         schedule. Unset means schedule only. Platform-owned;
#                         it never touches a customer's repository.
#   STRIPE_WEBHOOK_SECRET Stripe webhook signing secret
#   STRIPE_SECRET_KEY     Stripe secret key (optional — outbound calls only)
#   SERPER_API_KEY        Serper.dev SERP API key (A1 rank tracking). Now the
#                         *fallback*: Serper is a connectable provider, and a
#                         client's own key wins (see `resolveSerpKey`).
#   SARVAM_API_KEY        Sarvam API subscription key (A2 AI visibility). The
#                         engine this deployment polls.
#   OPENAI_API_KEY        OpenAI API key (A2 AI visibility, optional)
#   GEMINI_API_KEY        Google Gemini API key (A2 AI visibility, optional)
#
# Non-secret vars (safe to set as plaintext `vars` per environment, or in
# `.dev.vars` locally): GOOGLE_CLIENT_ID, GOOGLE_REDIRECT_URI, DASHBOARD_URL,
# ALLOWED_EMAILS, STRIPE_PRICE_TO_TIER, SERP_PROVIDER, SARVAM_MODEL,
# OPENAI_MODEL, GEMINI_MODEL.
#
# ALLOWED_EMAILS is the invite list. Left unset, any Google account that clears
# the consent screen can sign in and create its own account — the "invite-only"
# on the sign-in screen is then decoration. Set it with:
#   wrangler secret put ALLOWED_EMAILS   (or as a plaintext var per environment)
#
# GOOGLE_REDIRECT_URI must equal this Worker's deployed origin plus
# `/oauth/google/callback`, byte for byte — Google compares it exactly.
#
# Full catalogue + provisioning steps: docs/40-Integrations.md
# Local dev: copy `.dev.vars.example` → `.dev.vars` and fill in.
# Readiness at runtime: GET /health/integrations
